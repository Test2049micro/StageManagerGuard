name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DisplayProbe
        run: ./build.sh
      - name: Probe smoke test
        run: |
          ./bin/DisplayProbe screens
          ./bin/DisplayProbe pref
      - name: Regression tests
        # CI 无 GUI 会话：测试全部走桩与静态断言，不碰真实开关
        run: python3 -u tests/test_stage_manager_guard.py
      - name: Adversarial tests
        # 对抗套件：敌意文件/类型/时序下守卫的底线（I1 不动 GUI / I2 结果不翻账 / I3 不静默错账）
        run: python3 -u tests/test_adversarial.py
