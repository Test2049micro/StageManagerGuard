name: test

on:
  push:
  pull_request:

# Grant write permissions only to jobs that publish artifacts.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build DisplayProbe
        run: ./build.sh
      - name: Probe smoke test
        run: |
          ./bin/DisplayProbe screens
          ./bin/DisplayProbe pref
      - name: Regression tests
        # CI 无 GUI 会话：测试全部走桩与静态断言，不碰真实开关
        run: python3 -u tests/test_stage_manager_guard.py
      - name: Adversarial tests
        # 对抗套件：敌意文件/类型/时序下守卫的底线（I1 不动 GUI / I2 结果不翻账 / I3 不静默错账）
        run: python3 -u tests/test_adversarial.py
      - name: Fuzz (property-based)
        # 模糊层：随机组合世界×文件状态数千轮，断言安全不变式（固定种子可复现）
        run: |
          python3 -u tests/test_fuzz.py 20261017
          python3 -u tests/test_fuzz.py 1
          python3 -u tests/test_fuzz.py 42
      - name: Chaos (real two-process)
        # 真进程并发混沌：guard 轮询 + daemon 主循环 + 随机毁文件/杀进程
        # 只断言安全性质（不赌时序），时长固定
        run: |
          python3 -u tests/test_chaos.py 20261017 10
          python3 -u tests/test_chaos.py 7 10
